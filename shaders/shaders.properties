#define frosted_glass 2
#define normal_glass 1
name=Grafun
version=1.0
author=Gra
description=My first shader pack
profile.compatibility=true
# Enable DH LOD casters in Iris shadow pass; native shadow rendering remains enabled.
dhShadow.enabled=true
blend.dh_terrain=off
blend.dh_water=off
blend.dh_water.colortex3 = DST_COLOR ZERO ONE ONE
customTexture.starmap=image/Milkway.png
customTexture.starmaplight=image/Milkway_light.png
customTexture.perlin = image/perlin.bin TEXTURE_2D R8 1024 1024 RED UNSIGNED_BYTE
customTexture.cloudNoiseTex = image/cloud_simplex.bin TEXTURE_3D R8 128 128 128 RED UNSIGNED_BYTE
customTexture.Moonpicture=image/Moon.png
customTexture.MoonHeight=image/Moon_Displacement.png
customTexture.transmittance = image/transmittance.bin TEXTURE_2D RGBA32F 1024 1024 RGBA FLOAT
uniform.vec3.sun_origin_base_color= vec3(1.0,1.0,1.0)
uniform.float.glass=1.5

moon=false
shadowRenderSky=true
blend.gbuffers_water.colortex3 = DST_COLOR ZERO ONE ONE


# Parameter UI only. Default pipeline and textures are unchanged.
screen = [Sky] [Render] [Camera]
screen.columns = 2
screen.Sky = [Sun] [Moon] [Stars]
screen.Sky.columns = 2
screen.Sun = SUN_SIZE SUN_BRIGHTNESS rotation [SunColor]
screen.Sun.columns = 2
screen.SunColor = SUN_COLOR_R SUN_COLOR_G SUN_COLOR_B
screen.SunColor.columns = 2
screen.Moon = MOON_DISTANCE MOON_SIZE MOON_BRIGHTNESS MOONLIGHT_BRIGHTNESS [MoonAdvanced]
screen.Moon.columns = 2
screen.MoonAdvanced = MOON_ALBEDO_SCALE MOON_ALBEDO_OFFSET
screen.MoonAdvanced.columns = 2
screen.Stars = STAR_BRIGHTNESS
screen.Stars.columns = 2
screen.Render = [Shadows] [Reflection] [Lighting] [AntiAliasing]
screen.Render.columns = 2
screen.Shadows = shadowMapResolution shadowDistance SHADOW_RANGE SHADOW_RADIUS
screen.Shadows.columns = 2
screen.Reflection = REFLECTION_STRENGTH REFLECTION_BLUR SSR_MAX_STEPS SSR_STEP_SIZE SSR_THICKNESS
screen.Reflection.columns = 2
screen.Lighting = Realtime_Skylight Realtime_Sunlight SKYLIGHT_LIVE_SAMPLES BLOCKLIGHT_STRENGTH [BlocklightColor]
screen.Lighting.columns = 2
screen.BlocklightColor = BLOCKLIGHT_COLOR_R BLOCKLIGHT_COLOR_G BLOCKLIGHT_COLOR_B
screen.BlocklightColor.columns = 2
screen.AntiAliasing =TAA
screen.AntiAliasing.columns = 2
screen.Camera = [Exposure] [Bloom] [Lens] [Vignette] [ToneMapping] 
screen.Camera.columns = 2
screen.Exposure = Auto_Expousre Auto_Expousre_Mode Expousre_Gain EXPOSURE_ADAPTATION AUTO_EXPOSURE_SCALE MANUAL_EXPOSURE_DIVISOR
screen.Exposure.columns = 2
screen.Bloom = Bloom BLOOM_STRENGTH Bloom_Scatter BLOOM_THRESHOLD SUN_BLOOM_BOOST
screen.Bloom.columns = 2
screen.Lens = Sun_Bloom <empty> [LensHalo] [LensSpikes] [LensGhost]
screen.Lens.columns = 2
screen.LensHalo = SUN_HALO_INTENSITY MOON_HALO_INTENSITY HALO_MIE_G
screen.LensHalo.columns = 2
screen.LensSpikes = SUN_SPIKE_INTENSITY MOON_SPIKE_INTENSITY SPIKE_SHARPNESS
screen.LensSpikes.columns = 2
screen.LensGhost = GHOST_INTENSITY GHOST_SCALE_R GHOST_SCALE_G GHOST_SCALE_B
screen.LensGhost.columns = 2
screen.Vignette = Vignette Vignette_Type VIGNETTE_STRENGTH
screen.Vignette.columns = 2
screen.ToneMapping = TONEMAP_GAIN
screen.ToneMapping.columns = 2
sliders = SUN_SIZE SUN_BRIGHTNESS SUN_COLOR_R SUN_COLOR_G SUN_COLOR_B MOON_DISTANCE MOON_SIZE MOON_BRIGHTNESS MOONLIGHT_BRIGHTNESS MOON_ALBEDO_SCALE MOON_ALBEDO_OFFSET STAR_BRIGHTNESS SSR_STEP_SIZE SSR_THICKNESS REFLECTION_BLUR REFLECTION_STRENGTH BLOCKLIGHT_STRENGTH BLOCKLIGHT_COLOR_R BLOCKLIGHT_COLOR_G BLOCKLIGHT_COLOR_B EXPOSURE_ADAPTATION MANUAL_EXPOSURE_DIVISOR AUTO_EXPOSURE_SCALE BLOOM_STRENGTH BLOOM_THRESHOLD SUN_BLOOM_BOOST SUN_HALO_INTENSITY MOON_HALO_INTENSITY HALO_MIE_G SUN_SPIKE_INTENSITY MOON_SPIKE_INTENSITY SPIKE_SHARPNESS GHOST_INTENSITY GHOST_SCALE_R GHOST_SCALE_G GHOST_SCALE_B VIGNETTE_STRENGTH TONEMAP_GAIN rotation SHADOW_RADIUS Expousre_Gain Bloom_Scatter
separateAo=true
