name=Grafun
version=1.0
author=Gra
description=Grafun | Atmosphere, night sky, lighting and cinematic rendering
profile.compatibility=true
# Enable DH LOD casters in Iris shadow pass; native shadow rendering remains enabled.
dhShadow.enabled=true
blend.dh_terrain=off
blend.dh_water=off
blend.dh_water.colortex3 = DST_COLOR ZERO ONE ONE
customTexture.starmap=image/Milkway.png
customTexture.starmaplight=image/Milkway_light.png
customTexture.cloudNoiseTex = image/cloud_simplex.bin TEXTURE_3D R8 128 128 128 RED UNSIGNED_BYTE
customTexture.Moonpicture=image/Moon.png
customTexture.Earthpicture=image/Earth.png
customTexture.MoonHeight=image/Moon_Displacement.png
customTexture.transmittance = image/transmittance.bin TEXTURE_2D RGBA32F 1024 1024 RGBA FLOAT
customTexture.ozone = image/ozone.bin TEXTURE_2D RGBA32F 1024 1024 RGBA FLOAT
customTexture.multiscattering = image/multiscattering.bin TEXTURE_2D RGBA32F 1024 512 RGBA FLOAT
uniform.vec3.sun_origin_base_color= vec3(1.0,1.0,1.0)
uniform.float.glass=1.5
moon=false
shadowRenderSky=true
blend.gbuffers_water.colortex3 = DST_COLOR ZERO ONE ONE
# colortex8 is material metadata, never alpha-blend the water ID.
blend.gbuffers_water.colortex8=off
blend.dh_water.colortex8=off


# ============================================================================
# Grafun simplified Iris settings / maximum one submenu level.
# Moon rendering, sun RGB channels, star brightness and fine tuning remain
# at original defaults, but are not cluttering the UI.
# Planet geometry is placed on the home page for quick access.
# ============================================================================
screen = EARTH_RADIUS_KM SEA_LEVEL_Y AIRGLOW [Sky] [Lighting] [Water] [Camera] [Effects]
screen.columns = 2

# One-level sections only; no child screens.
screen.Sky = SKY_VIEW_LUT SUN_SIZE SUN_BRIGHTNESS rotation Highscatter
screen.Sky.columns = 2

screen.Lighting = shadowMapResolution shadowDistance SHADOW_RANGE SHADOW_RADIUS BLOCKLIGHT_STRENGTH Realtime_Skylight Realtime_Sunlight SKYLIGHT_LIVE_SAMPLES
screen.Lighting.columns = 2

screen.Water = WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_REFRACTION WATER_ABSORPTION WATER_SHORE_FOAM REFLECTION_STRENGTH REFLECTION_BLUR SSR_MAX_STEPS SSR_STEP_SIZE SSR_THICKNESS
screen.Water.columns = 2

screen.Camera = Auto_Expousre Auto_Expousre_Mode Expousre_Gain EXPOSURE_ADAPTATION MANUAL_EXPOSURE_DIVISOR TONEMAP_GAIN TAA
screen.Camera.columns = 2

screen.Effects = Bloom BLOOM_STRENGTH Bloom_Scatter BLOOM_THRESHOLD Sun_Bloom SUN_BLOOM_BOOST Vignette Vignette_Type VIGNETTE_STRENGTH GHOST_INTENSITY 
screen.Effects.columns = 2

sliders = EARTH_RADIUS_KM SEA_LEVEL_Y SUN_SIZE SUN_BRIGHTNESS rotation shadowMapResolution shadowDistance SHADOW_RANGE SHADOW_RADIUS BLOCKLIGHT_STRENGTH SKYLIGHT_LIVE_SAMPLES WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_REFRACTION WATER_ABSORPTION WATER_SHORE_FOAM REFLECTION_STRENGTH REFLECTION_BLUR SSR_MAX_STEPS SSR_STEP_SIZE SSR_THICKNESS Expousre_Gain EXPOSURE_ADAPTATION MANUAL_EXPOSURE_DIVISOR TONEMAP_GAIN BLOOM_STRENGTH Bloom_Scatter BLOOM_THRESHOLD SUN_BLOOM_BOOST VIGNETTE_STRENGTH GHOST_INTENSITY
separateAo=true

# Sky View: 256x128 HDR atmosphere-scattering-only target.
size.buffer.colortex13=256 128
# Dedicated 128 x 4 HDR cache: six directional skylight averages,
# 96 independent sample rays, 32 optional fog samples, and metadata.
# No G-buffers program writes to this buffer. The 128 x 4 size is
# sufficient for highest scratch coordinate (111,1) and data (5,2).
size.buffer.colortex14=128 4
blend.deferred=off
blend.composite=off
blend.composite7=off
blend.deferred1=off
